<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
</head>
<body>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f8;
        padding: 20px;
    }

    h2 {
        color: #333;
        margin-bottom: 20px;
    }

    form {
        max-width: 400px;
        background-color: #fff;
        padding: 50px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    form div {
        margin-bottom: 15px;
    }

    label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #555;
    }

    input[type="text"],
    input[type="number"] {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
    }

    input:focus {
        border-color: #32CD32;
        box-shadow: 0 0 4px rgba(76, 175, 80, 0.4);
    }

    button {
        background-color: #4CAF50;
        color: #fff;
        border: none;
        padding: 10px 16px;
        border-radius: 5px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background-color: #45a049;
    }

    a {
        display: inline-block;
        margin-top: 15px;
        text-decoration: none;
        color: #4CAF50;
        font-weight: bold;
    }

    a:hover {
        text-decoration: underline;
    }

    .error{
    color: red;
    font-weight: 900;
    font-size: 2em;
    }
</style>
    <h2>Add New Book</h2>

    <form th:action="@{/books}"
          th:object="${book}"
          method="post">

        <input type="hidden" th:field="*{id}"/>

        <div>
            <label>Title:</label>
            <input type="text" th:field="*{title}"/>
            <br>
            <span class="error" th:if="${#fields.hasErrors('title')} ? 'error-field'"
            th:errors="*{title}"></span>
        </div>

        <div>
            <label>Author:</label>
            <input type="text" th:field="*{author}"/>
            <br>
            <span class="error"
                  th:if="${#fields.hasErrors('author')} ? 'error-field'"
                  th:errors="*{author}"></span>
        </div>

        <div>
            <label>Price:</label>
            <input type="text" th:field="*{price}"/>
            <br>
            <span class="error"
                  th:if="${#fields.hasErrors('price')} ? 'error-field'"
                  th:errors="*{price}"></span>
        </div>

        <div>
            <label>Amount:</label>
            <input type="text" th:field="*{amount}"/>
            <br>
            <span class="error"
                  th:if="${#fields.hasErrors('amount')} ? 'error-field'"
                  th:errors="*{amount}"></span>
        </div>

        <button type="submit">Save</button>
    </form>
    <a th:href="@{/books}">Back</a>
</body>
</html>
