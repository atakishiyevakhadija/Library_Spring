<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Books</title>
</head>
<body>
<style>
    body {
       font-family: Arial, sans-serif;
       background-color: #f4f6f8;
       padding: 20px;
   }

   h2 {
       color: #333;
       margin-bottom: 10px;
   }

   a {
       text-decoration: none;
       color: #fff;
       background-color: #4CAF50;
       padding: 8px 14px;
       border-radius: 5px;
       font-weight: bold;
   }

   a:hover {
       background-color: #45a049;
   }

   table {
       width: 100%;
       background-color: #fff;
       box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
   }

   th, td {
       padding: 12px 15px;
       text-align: left;
       border-bottom: 1px solid #ddd;
   }

   th {
       background-color: #2c3e50;
       color: #fff;
       text-transform: uppercase;
       font-size: 14px;
   }

   tr:hover {
       background-color: #eaf2f8;
   }

   td {
       color: #333;
   }
    button{
    text-decoration: none;
       color: #fff;
       background-color: #4CAF50;
       padding: 8px 14px;
       border-radius: 5px;
       font-weight: bold;
       font-size: 15px;
       border-color: yellow;
       border-size: 7px;
    }
    button:focus{
    background-color: blue;
    }
    input{
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
    }
    input:focus{
    background-color: black;
    color: white;
    }
</style>
    <h2>Book List</h2>

     <form th:action="@{/logout}" method="post">
         <button type="submit" style="margin-bottom: 40px;">Logout</button>
     </form>

    <a th:if="${isAdmin}" th:href="@{/books/new}">+ Add New Book</a>

    <br> <br>

      <form th:action="@{/books/search}" method="get" style="margin-bottom: 15px;">
          <input type="text"
                 name="keyword"
                 placeholder="Search by Title"
                 th:value="${keyword}">
          <button type="submit">Search</button>
          <a th:href="@{/books}" style="margin-left: 10px;">Reset</a>
      </form>

   <table border="1">
       <tr>
           <th>Title</th>
           <th>Author</th>
           <th>Price</th>
           <th>Amount</th>
           <th th:if="${isAdmin}">Actions</th>
       </tr>
       <tr th:each="book : ${books}">
           <td th:text="${book.title}"></td>
           <td th:text="${book.author}"></td>
           <td th:text="${book.price}"></td>
           <td th:text="${book.amount}"></td>
           <td>
               <a th:if="${isAdmin}" th:href="@{/books/edit/{id}(id=${book.id})}">Edit</a>
               <a th:if="${isAdmin}" th:href="@{/books/delete/{id}(id=${book.id})}"
               onclick="return confirm('Are you sure?')">Delete</a>
           </td>
       </tr>
   </table>
    <div style="margin-top: 20px;">
        <a th:if="${currentPage > 0}" th:href="@{/books(page = ${currentPage - 1}, size = ${size})}">←</a>
        <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
<!--             если есть search-->
            <a th:if="${keyword != null}"
             th:href="@{/books/search(keyword=${keyword}, page=${i}, size=${size})}"
               th:text="${i + 1}"
               style="${i == currentPage} ? 'font-weight:bold' : ''">
            </a>


<!--               если обычный список-->
             <a th:if="${keyword == null}"
                th:href="@{/books(page=${i}, size=${size})}"
                th:text="${i + 1}"
                style="${i == currentPage} ? 'font-weight:bold' : ''">
            </a>
        </span>

        <a th:if="${currentPage + 1 < totalPages}" th:href="@{/books(page = ${currentPage + 1}, size = ${size})}">→</a>

    </div>
</body>
</html>
