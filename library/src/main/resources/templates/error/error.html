<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <style>
        body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .error-container {
        text-align: center;
        background: rgba(0, 0, 0, 0.35);
        padding: 40px 60px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h2 {
        font-size: 64px;
        margin-bottom: 15px;
    }

    p {
        font-size: 20px;
        margin-bottom: 25px;
        color: #ffdddd;
    }

    a {
        display: inline-block;
        padding: 12px 28px;
        background: #ff4b5c;
        color: white;
        text-decoration: none;
        font-size: 16px;
        border-radius: 8px;
        transition: 0.3s ease;
    }

    a:hover {
        background: #ff1f3a;
        transform: scale(1.05);
    }

    </style>
</head>
<body>
<a th:href="@{?lang=en}">EN</a>
<a th:href="@{?lang=ru}">RU</a>
<a th:href="@{?lang=az}">AZ</a>
   <h2 th:text="#{error.notfound}"></h2>
   <br>
   <p th:text="${errorMessage}"></p>
   <a href="/books" th:text="#{button.back}"></a>
</body>
</html>
